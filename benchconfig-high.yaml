test:
  name: e-spill-baseline-high-intensity
  description: High intensity baseline - heavy GC pressure (1000 tx/s for 15 minutes, trigger old gen GCs)
  workers:
    type: local
    number: 20
  rounds:
    - label: high-intensity-bloat
      txDuration: 900  # 15 minutes
      rateControl:
        type: fixed-load
        opts:
          transactionLoad: 1000
      workload:
        module: benchmarks/stateBloat.js
        arguments:
          slotsPerTx: 50
          contractId: StateBloater
