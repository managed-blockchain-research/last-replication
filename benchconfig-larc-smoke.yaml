test:
  name: larc-smoke
  description: LARC smoke test — 30s warmup + 90s measure, 150 TPS, 30 workers, 30 contracts.
  workers:
    type: local
    number: 30
  rounds:
    - label: warmup
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 150
      workload:
        module: benchmarks/stateBloat.js
        arguments:
          slotsPerTx: 200
          numContracts: 30
          contractPrefix: SB
    - label: measure
      txDuration: 90
      rateControl:
        type: fixed-rate
        opts:
          tps: 150
      workload:
        module: benchmarks/stateBloat.js
        arguments:
          slotsPerTx: 200
          numContracts: 30
          contractPrefix: SB
